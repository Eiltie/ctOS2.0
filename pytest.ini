[pytest]
# 测试放 tests/，和 tests/e2e/ 分开：
#   tests/  → 假的、快的、必须全绿（不联网、不连库、不要 API key）
#   tests/e2e/ → 真的、慢的、看趋势（要起服务 + 真实模型）

testpaths = tests
python_files = test_*.py

# -ra：结束时把失败/跳过的原因列一遍，不用往上翻
addopts = -ra --strict-markers

# 这些警告来自第三方库（langsmith 用了 Python 3.16 将移除的 API），
# 我们改不了，也别让它们淹没真正的失败信息。
filterwarnings =
    ignore::DeprecationWarning:langsmith.*
    ignore::DeprecationWarning
