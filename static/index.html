<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ctOS 2.0</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='19'>%E2%9A%A1</text></svg>" />

    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/modules.css">
</head>
<body>

    <div id="cursor-aura"></div>

    <div class="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon">i</div>
            <div class="logo-text">
                <h1>ctOS 2.0</h1>
                <p>SUPER INTELLIGENCE UNIT</p>
            </div>
        </div>

        <div class="history-section custom-scroll">
            <div class="history-title">会话记录</div>

            <div id="history-chat" class="view-section active"></div>
            <div id="history-trip" class="view-section"></div>
            <div id="history-customer" class="view-section"></div>
        </div>

        <div class="sidebar-footer">
            <div class="status-row"><span>状态</span><span class="status-online"><span class="status-dot"></span> 在线</span></div>
            <div class="status-row"><span>模型</span><span class="status-value" id="foot-model">deepseek-v4-flash</span></div>
            <div class="status-row"><span>端点</span><span class="status-value" id="foot-endpoint">POST /chat</span></div>
        </div>
    </div>

    <div class="main-content">
        <div class="top-nav">
            <div class="nav-tabs">
                <div class="nav-tab active" onclick="switchView('chat')">闲聊</div>
                <div class="nav-tab" onclick="switchView('trip')">智能出行</div>
                <div class="nav-tab" onclick="switchView('customer')">智能客服</div>
            </div>
            <div class="nav-status">
                <div id="status-chat" class="tag-status view-section active">LANGGRAPH · READY</div>
                <div id="status-trip" class="tag-status view-section">TRIP AGENT · READY</div>
                <div id="status-customer" class="tag-status view-section">RAG · READY</div>
                <button class="new-session-btn" onclick="triggerHologram()">新会话</button>
            </div>
        </div>

        <div id="view-chat" class="view-section active">
            <div id="hologram-overlay" class="hologram-reset"></div>

            <div class="chat-area custom-scroll" id="chat-feed"></div>

            <div class="bottom-section">
                <div class="quick-prompts">
                    <button class="prompt-btn">你好，介绍一下你自己</button>
                    <button class="prompt-btn">帮我梳理今天的待办事项</button>
                </div>
                <div class="input-wrapper">
                    <div class="b-left"></div><div class="b-right"></div>
                    <input type="text" id="chat-input" placeholder="向 ctOS 发送指令... (Enter 发送)">
                    <button class="send-btn" onclick="sendChat()">➤</button>
                </div>
                <div class="bottom-status"><span>READY</span><span id="char-count">0 字符</span></div>
            </div>
        </div>

        <div id="view-trip" class="view-section">
            <div class="trip-scroll-wrap">
                <div class="trip-fixed" id="trip-fixed"></div>
                <div class="trip-stream custom-scroll" id="trip-feed"></div>
                <button class="trip-scroll-btn" id="trip-scroll-btn" style="display:none">回到最新 ↓</button>
            </div>
            <div class="bottom-section">
                <div class="input-wrapper">
                    <div class="b-left"></div><div class="b-right"></div>
                    <input type="text" id="trip-input" placeholder="告诉我想去哪儿玩...">
                    <button class="send-btn" onclick="sendTrip()">➤</button>
                </div>
                <div class="bottom-status"><span>READY</span><span id="trip-status">TRIP AGENT</span></div>
            </div>
        </div>

        <div id="view-customer" class="view-section">
            <div class="chat-area custom-scroll" id="customer-feed">
                <div class="customer-welcome">
                    <div class="radar-wrap">
                        <div style="color: var(--cyan); font-weight: bold; font-size: 18px;">R</div>
                    </div>
                    <h2>ctOS 智能客服</h2>
                </div>
            </div>
            <div class="bottom-section">
                <div class="input-wrapper">
                    <div class="b-left"></div><div class="b-right"></div>
                    <input type="text" id="customer-input" placeholder="问一个关于本项目的问题...">
                    <button class="send-btn" onclick="sendCustomer()">➤</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/trip.js"></script>
    <script src="/static/js/customer.js"></script>
</body>
</html>
