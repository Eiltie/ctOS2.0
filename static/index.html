<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ctOS 2.0</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='19'>%E2%9A%A1</text></svg>" />

    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/modules.css">
</head>
<body>

    <div id="cursor-aura"></div>

    <!-- 登录页：没有 token 时显示，主界面隐藏 -->
    <div id="login-screen" class="login-screen">
        <div class="login-box">
            <div class="login-brand">
                <div class="logo-icon">i</div>
                <div class="logo-text">
                    <h1>ctOS 2.0</h1>
                    <p>SUPER INTELLIGENCE UNIT</p>
                </div>
            </div>

            <h2 id="login-title" class="login-title">登录 ctOS</h2>
            <p id="login-sub" class="login-sub">登录后继续你的对话</p>

            <div class="login-form">
                <label class="login-label">邮箱</label>
                <input type="email" id="login-email" class="login-input"
                       placeholder="you@example.com" autocomplete="username">

                <label class="login-label">密码</label>
                <input type="password" id="login-password" class="login-input"
                       placeholder="至少 6 位" autocomplete="current-password">

                <div id="login-error" class="login-error"></div>

                <button id="login-submit" class="login-btn" data-mode="login"
                        onclick="submitAuth()">登录</button>

                <button id="login-toggle" class="login-toggle" type="button"
                        onclick="switchLoginMode(document.getElementById('login-submit').dataset.mode === 'register' ? 'login' : 'register')">
                    还没有账号？去注册
                </button>
            </div>
        </div>
    </div>

    <!-- 主界面：登录后才显示 -->
    <div id="app-root" class="app-root">

    <div class="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon">i</div>
            <div class="logo-text">
                <h1>ctOS 2.0</h1>
                <p>SUPER INTELLIGENCE UNIT</p>
            </div>
        </div>

        <div class="history-section custom-scroll">
            <div class="history-title">
                <span id="history-title-text">会话记录</span>
                <button id="history-select-btn" class="history-select-btn" title="多选" style="display:none"></button>
            </div>

            <div id="history-chat" class="view-section active"></div>
            <div id="history-trip" class="view-section"></div>
            <div id="history-customer" class="view-section"></div>
        </div>

        <div class="sidebar-footer">
            <div class="status-row"><span>账号</span><span class="status-value" id="user-email"></span></div>
            <div class="status-row"><span>状态</span><span class="status-online"><span class="status-dot"></span> 在线</span></div>
            <div class="status-row"><span>模型</span><span class="status-value" id="foot-model">deepseek-v4-flash</span></div>
            <div class="status-row"><span>端点</span><span class="status-value" id="foot-endpoint">POST /chat</span></div>
            <button class="logout-btn" onclick="logout()">退出登录</button>
        </div>
    </div>

    <div class="main-content">
        <div class="top-nav">
            <div class="nav-tabs">
                <div class="nav-tab active" onclick="switchView('chat')">闲聊</div>
                <div class="nav-tab" onclick="switchView('trip')">智能出行</div>
                <div class="nav-tab" onclick="switchView('customer')">智能客服</div>
            </div>
            <div class="nav-status">
                <div id="status-chat" class="tag-status view-section active">LANGGRAPH · READY</div>
                <div id="status-trip" class="tag-status view-section">TRIP AGENT · READY</div>
                <div id="status-customer" class="tag-status view-section">RAG · READY</div>
                <button class="new-session-btn" onclick="triggerHologram()">新会话</button>
            </div>
        </div>

        <div id="view-chat" class="view-section active">
            <div id="hologram-overlay" class="hologram-reset"></div>

            <div class="chat-area custom-scroll" id="chat-feed"></div>

            <div class="bottom-section">
                <div class="quick-prompts">
                    <button class="prompt-btn">你好，介绍一下你自己</button>
                    <button class="prompt-btn">帮我梳理今天的待办事项</button>
                </div>
                <div class="input-wrapper">
                    <div class="b-left"></div><div class="b-right"></div>
                    <input type="text" id="chat-input" placeholder="向 ctOS 发送指令... (Enter 发送)">
                    <button class="send-btn" onclick="sendChat()">➤</button>
                </div>
                <div class="bottom-status"><span>READY</span><span id="char-count">0 字符</span></div>
            </div>
        </div>

        <div id="view-trip" class="view-section">
            <!-- 开场态：还没开始聊时，欢迎语和输入框居中显示 -->
            <div id="trip-hero" class="trip-hero">
                <div class="hero-greeting">
                    <img class="hero-icon" src="/static/image/CTOS.webp" alt="">
                    <!-- 这句会被 tripRefreshGreeting() 按当前时间替换掉，这里只是加载前占位 -->
                    <span id="trip-greeting">有什么我能帮你的吗？</span>
                </div>

                <div class="hero-input">
                    <div class="b-left"></div><div class="b-right"></div>
                    <input type="text" id="trip-input-hero" placeholder="告诉我想去哪儿玩...">
                    <button class="send-btn" onclick="sendTrip()">➤</button>
                </div>
            </div>

            <!-- 对话态：聊开之后输入框落到底部，内容往上排 -->
            <div class="trip-scroll-wrap" id="trip-chat-pane" style="display:none">
                <div class="trip-fixed" id="trip-fixed"></div>
                <div class="trip-stream custom-scroll" id="trip-feed"></div>
                <button class="trip-scroll-btn" id="trip-scroll-btn" style="display:none">回到最新 ↓</button>
            </div>
            <div class="bottom-section" id="trip-bottom" style="display:none">
                <div class="input-wrapper">
                    <div class="b-left"></div><div class="b-right"></div>
                    <input type="text" id="trip-input" placeholder="告诉我想去哪儿玩...">
                    <button class="send-btn" onclick="sendTrip()">➤</button>
                </div>
                <div class="bottom-status"><span>READY</span><span id="trip-status">TRIP AGENT</span></div>
            </div>
        </div>

        <div id="view-customer" class="view-section">
            <div class="chat-area custom-scroll" id="customer-feed">
                <div class="customer-welcome">
                    <div class="radar-wrap">
                        <div style="color: var(--cyan); font-weight: bold; font-size: 18px;">R</div>
                    </div>
                    <h2>ctOS 智能客服</h2>
                </div>
            </div>
            <div class="bottom-section">
                <div class="input-wrapper">
                    <div class="b-left"></div><div class="b-right"></div>
                    <input type="text" id="customer-input" placeholder="问一个关于本项目的问题...">
                    <button class="send-btn" onclick="sendCustomer()">➤</button>
                </div>
            </div>
        </div>
    </div>
    </div><!-- /#app-root -->

    <!-- 加载顺序不能乱：
         1. common/ 里都是无状态工具，先加载
         2. app.js 定义全局 state 和闲聊逻辑
         3. trip.js / customer.js 依赖 app.js 里的 state 和 common/ 里的工具 -->
    <script src="/static/js/common/config.js"></script>
    <script src="/static/js/common/utils.js"></script>
    <script src="/static/js/common/auth.js"></script>
    <script src="/static/js/common/abort.js"></script>
    <script src="/static/js/common/sse.js"></script>
    <script src="/static/js/common/typer.js"></script>
    <script src="/static/js/common/selection.js"></script>
    <script src="/static/js/common/sticky.js"></script>
    <script src="/static/js/common/aura.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/trip.js"></script>
    <script src="/static/js/customer.js"></script>
</body>
</html>
