<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ctOS · 出行拆分预览（纯前端原型）</title>
<!-- 直接复用项目里的三份样式，保证观感一致 -->
<link rel="stylesheet" href="../static/css/style.css">
<link rel="stylesheet" href="../static/css/modules.css">
<link rel="stylesheet" href="../static/css/theme.css">
<style>
  /* ===== 仅原型用的补充样式，正式实现时会并入 modules.css ===== */

  /* 分段条：结构和闲聊页的 .chat-plugins 一致，颜色也用同一套；
     这里只把它固定在出行视图顶部，不参与滚动 */
  .trip-plugins {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      padding: 10px 10%;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-main);
      overflow-x: auto;
  }
  .trip-plugin {
      padding: 5px 13px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: color .2s ease, background .2s ease, border-color .2s ease;
  }
  .trip-plugin:hover { background: var(--cyan-dim); color: var(--cyan); }
  .trip-plugin.active {
      background: var(--cyan);
      border-color: var(--cyan);
      color: var(--accent-ink, #041018);
  }

  /* 记录列表的模式标签。用 last_kind 上色，不改表结构 */
  .kind-tag {
      flex-shrink: 0;
      margin-right: 6px;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      line-height: 1.6;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
  }
  .kind-tag.route { color: var(--cyan); border-color: var(--cyan-border); background: var(--cyan-dim); }
  .kind-tag.guide { color: #c4b5fd; border-color: rgba(196, 181, 253, .4); background: rgba(196, 181, 253, .12); }
  .kind-tag.chat  { color: var(--text-muted); }

  /* SUGGEST 转场按钮：挂在回复气泡下方，不单独占一块面板 */
  .suggest-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: -2px;
  }
  .suggest-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border: 1px solid var(--cyan-border);
      border-radius: 999px;
      background: var(--cyan-dim);
      color: var(--cyan);
      font-size: 13px;
      cursor: pointer;
      transition: background .2s, border-color .2s;
  }
  .suggest-btn:hover { background: rgba(34, 211, 238, .25); border-color: var(--cyan); }
  .suggest-note { font-size: 12px; color: var(--text-muted); }

  /* 攻略卡片的展开区：简介 + 生成攻略按钮 */
  .card-intro {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border-color);
      font-size: 12px;
      line-height: 1.7;
      color: var(--text-muted);
  }
  .card-intro .ci-line { margin-bottom: 4px; }
  .card-intro .ci-go {
      margin-top: 10px;
      width: 100%;
      padding: 7px 0;
      border: 1px solid var(--cyan-border);
      border-radius: 6px;
      background: var(--cyan-dim);
      color: var(--cyan);
      font-size: 12px;
      cursor: pointer;
      transition: background .2s;
  }
  .card-intro .ci-go:hover { background: rgba(34, 211, 238, .25); }
  .trip-card.is-open { border-color: var(--cyan); background-color: #161b22; }

  /* 原型工具条（不是产品的一部分） */
  .proto-bar {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border: 1px solid var(--cyan-border);
      border-radius: 999px;
      background: rgba(10, 14, 20, .94);
      backdrop-filter: blur(6px);
      font-size: 11px;
      color: var(--text-muted);
      box-shadow: 0 6px 24px rgba(0, 0, 0, .5);
  }
  .proto-bar button {
      padding: 3px 9px;
      border: 1px solid var(--border-color);
      border-radius: 999px;
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      cursor: pointer;
  }
  .proto-bar button:hover { color: var(--cyan); border-color: var(--cyan-border); }
  .proto-bar b { color: var(--cyan); font-weight: 500; }

  /* 布局骨架：只用来撑起一个像样的出行视图 */
  .proto-app { display: flex; height: 100vh; }
  .proto-side {
      width: 240px; flex-shrink: 0;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      padding: 14px 12px;
      overflow-y: auto;
  }
  .proto-side .history-title {
      font-size: 11px; letter-spacing: 1px; color: var(--text-muted);
      margin-bottom: 10px;
  }
  .proto-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .proto-top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px; border-bottom: 1px solid var(--border-color);
  }
  .proto-nav { display: flex; gap: 18px; font-size: 13px; }
  .proto-nav span { color: var(--text-muted); cursor: default; }
  .proto-nav span.on { color: var(--cyan); }
  .tag-status {
      font-size: 11px; letter-spacing: 1px; color: var(--text-muted);
  }
  #view { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  .trip-hero { flex: 1; }
</style>
</head>
<body>

<div class="proto-app">

  <!-- ===== 左栏：共用一份记录，带模式标签 ===== -->
  <aside class="proto-side">
    <div class="history-title">会话记录</div>
    <div id="history-list"></div>
  </aside>

  <main class="proto-main">
    <div class="proto-top">
      <div class="proto-nav">
        <span>闲聊</span><span class="on">智能出行</span><span>智能客服</span>
      </div>
      <div id="status-tag" class="tag-status">TRIP AGENT · READY</div>
    </div>

    <div id="view">

      <!-- ===== 分段条：本次要加的东西 ===== -->
      <div class="trip-plugins">
        <button class="trip-plugin active" data-mode="route" type="button">路线规划</button>
        <button class="trip-plugin" data-mode="guide" type="button">旅游攻略</button>
      </div>

      <!-- ===== 开场态：欢迎语 + 输入框 + 预设（两个模式共用骨架） ===== -->
      <div id="hero" class="trip-hero">
        <div class="hero-greeting">
          <img class="hero-icon" src="../static/image/CTOS.webp" alt="">
          <span id="greeting">有什么我能帮你的吗？</span>
        </div>

        <div class="hero-input">
          <div class="b-left"></div><div class="b-right"></div>
          <input type="text" id="hero-input" placeholder="">
          <button class="send-btn trip-send-btn" type="button" onclick="send()" title="发送">➤</button>
        </div>

        <div class="trip-quick" id="hero-quick"></div>

        <!-- 旅游攻略模式下，开场就给一张景点卡片墙 -->
        <div id="hero-cards" style="display:none; width:100%; max-width:900px;">
          <div class="trip-cards" id="cards-grid"></div>
        </div>
      </div>

      <!-- ===== 对话态 ===== -->
      <div class="trip-scroll-wrap" id="chat-pane" style="display:none">
        <div class="trip-fixed" id="fixed"></div>
        <div class="trip-stream custom-scroll" id="feed"></div>
      </div>
      <div class="bottom-section" id="bottom" style="display:none">
        <div class="input-wrapper">
          <div class="b-left"></div><div class="b-right"></div>
          <input type="text" id="chat-input" placeholder="">
          <button class="send-btn trip-send-btn" type="button" onclick="send()" title="发送">➤</button>
        </div>
        <div class="bottom-status"><span>READY</span><span id="feed-status">TRIP AGENT</span></div>
      </div>

    </div>
  </main>
</div>

<div class="proto-bar">
  <b>原型</b>
  <span>纯前端，不连后端</span>
  <button onclick="resetTo('route')">路线 · 开场</button>
  <button onclick="demoRoute()">路线 · 示例对话</button>
  <button onclick="demoGuide()">攻略 · 开场</button>
  <button onclick="demoGuideChat()">攻略 · 示例对话</button>
  <button onclick="toggleTheme()">换主题</button>
</div>

<script>
/* ===================================================================
   这是「拆分后长什么样」的纯前端原型。
   所有内容都是写死的假数据，用来确认版式和交互，
   不代表最终文案。真正的实现会复用项目里的 trip.js 骨架。
   =================================================================== */

const MODES = {
  route: {
    label: "路线规划",
    status: "TRIP AGENT · READY",
    inputPh: "从哪到哪？比如：从杭州东站到灵隐寺，带老人",
    greeting: "说个起点和终点，我来帮你比一比",
    quick: [
      "从杭州东站到灵隐寺，带老人，少走路",
      "9 点要到西湖开会，几点出门合适",
      "去西湖，打车和地铁分别多久多少钱",
      "想去杭州玩 3 天"          // ← 故意放一句跨模式的，演示引流
    ],
    steps: ["确认需求", "查询候选", "推荐方案", "出发提醒"],
    stepKeys: ["route_need", "route_compare", "route_decision", "route_tips"],
    cards: null
  },
  guide: {
    label: "旅游攻略",
    status: "GUIDE AGENT · READY",
    inputPh: "想去哪玩？比如：下周去杭州玩 3 天，带老人",
    greeting: "想去哪玩？也可以从下面的卡片里挑一个",
    quick: [
      "下周去杭州玩 3 天，带老人",
      "成都 4 天带小孩，想去科技馆",
      "杭州东站到灵隐寺怎么走"      // ← 同样是跨模式的一句
    ],
    steps: ["查询天气", "推荐景点", "安排行程", "游玩建议"],
    stepKeys: ["weather", "spots", "itinerary", "advice"],
    cards: [
      { city: "杭州", name: "西湖",   tag: "湖景 · 步行", intro: "断桥、苏堤、白堤连成一线，靠走和坐船，是杭州最经典的一圈。" },
      { city: "杭州", name: "灵隐寺", tag: "寺庙 · 爬山", intro: "飞来峰石刻加山间古寺，逛下来半天，台阶多，带老人要慢。" },
      { city: "杭州", name: "西溪湿地", tag: "湿地 · 坐船", intro: "水道纵横，坐摇橹船最舒服，适合半天慢逛。" },
      { city: "成都", name: "四川科技馆", tag: "室内 · 亲子", intro: "天府广场旁，互动展项多，室内不受天气影响，适合带孩子。" },
      { city: "成都", name: "宽窄巷子", tag: "街区 · 吃逛", intro: "老街区改建，逛吃为主，晚上人多但热闹。" },
      { city: "成都", name: "熊猫基地", tag: "动物 · 室外", intro: "看熊猫要趁早，上午活跃，园区大，建议留半天。" }
    ]
  }
};

let mode = "route";
let themeIdx = 0;
const THEMES = ["", "street", "cyber"];

/* ---------- 小工具 ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* ---------- 记录（假的） ---------- */
const RECORDS = [
  { id: 3, kind: "GUIDE", title: "成都 4 天带小孩" },
  { id: 2, kind: "ROUTE", title: "杭州东站→灵隐寺" },
  { id: 1, kind: "ROUTE", title: "去西湖打车还是地铁" },
  { id: 0, kind: "CHAT",  title: "杭州明天下雨吗" }
];

const KIND_TAG = { GUIDE: ["guide", "攻略"], ROUTE: ["route", "路线"], CHAT: ["chat", "问答"] };

function renderHistory() {
  $("history-list").innerHTML = RECORDS.map((r) => {
    const [cls, text] = KIND_TAG[r.kind];
    return `<div class="history-item"><span class="kind-tag ${cls}">${text}</span>` +
           `<span class="hi-title">${esc(r.title)}</span></div>`;
  }).join("");
}

/* ---------- 顶部进度条 ---------- */
function renderFixed() {
  const m = MODES[mode];
  const steps = m.steps.map((label, i) =>
    `<div class="process-step" data-step="${m.stepKeys[i]}" data-state="wait">` +
    `<span class="step-num">${String(i + 1).padStart(2, "0")}</span> ${esc(label)}</div>` +
    (i < m.steps.length - 1 ? `<span class="step-arrow"></span>` : "")
  ).join("");

  $("fixed").innerHTML = `<div class="trip-header" data-sticky-head>` +
    `<div class="process-flow">${steps}</div>` +
    `<div class="trip-cards" id="inline-cards" style="display:none"></div></div>`;
}

function stepSet(idx, state) {
  const steps = $("fixed").querySelectorAll(".process-step");
  const arrows = $("fixed").querySelectorAll(".step-arrow");
  steps.forEach((s, i) => {
    if (i === idx) s.dataset.state = state;
  });
  arrows.forEach((a, i) => {
    a.classList.toggle("is-past", i < idx);
    a.classList.toggle("is-active", i === idx);
  });
}

/* ---------- 开场 / 对话 切换 ---------- */
function showHero() {
  $("hero").style.display = "";
  $("chat-pane").style.display = "none";
  $("bottom").style.display = "none";
  $("feed").innerHTML = "";
  const m = MODES[mode];
  $("status-tag").textContent = m.status;
  $("feed-status").textContent = m.status;

  $("greeting").textContent = m.greeting;
  $("hero-input").placeholder = m.inputPh;
  $("chat-input").placeholder = m.inputPh;

  $("hero-quick").innerHTML = m.quick.map((q) =>
    `<button class="prompt-btn trip-quick-btn" type="button" data-q="${esc(q)}">${esc(q)}</button>`
  ).join("");
  $("hero-quick").style.display = "";

  // 攻略模式额外给卡片墙；路线模式不给
  const hasCards = !!m.cards;
  $("hero-cards").style.display = hasCards ? "" : "none";
  if (hasCards) renderCards($("cards-grid"), () => showHero());
}

function showChat() {
  $("hero").style.display = "none";
  $("chat-pane").style.display = "";
  $("bottom").style.display = "";
  renderFixed();
}

/* ---------- 景点卡片 ---------- */
function renderCards(box, onPick) {
  box.innerHTML = MODES.guide.cards.map((c, i) =>
    `<div class="trip-card" data-i="${i}">` +
      `<h4>${esc(c.city)} · ${esc(c.name)}</h4>` +
      `<p>${esc(c.tag)}</p>` +
      `<div class="card-intro" style="display:none">` +
        `<div class="ci-line">${esc(c.intro)}</div>` +
        `<div class="ci-line" style="opacity:.65">营业时间、门票请以官方为准，出发前再确认一次。</div>` +
        `<button class="ci-go" type="button">按这个生成攻略</button>` +
      `</div>` +
    `</div>`
  ).join("");

  box.querySelectorAll(".trip-card").forEach((card) => {
    card.onclick = (e) => {
      if (e.target.classList.contains("ci-go")) {
        const c = MODES.guide.cards[Number(card.dataset.i)];
        if (onPick) switchMode("guide", `想去${c.city}玩 3 天，重点想去${c.name}`);
        return;
      }
      // 点卡片：展开简介，再点收起
      box.querySelectorAll(".trip-card").forEach((o) => {
        if (o !== card) { o.classList.remove("is-open"); o.querySelector(".card-intro").style.display = "none"; }
      });
      const open = card.classList.toggle("is-open");
      card.querySelector(".card-intro").style.display = open ? "" : "none";
    };
  });
}

/* ---------- 气泡与进度 ---------- */
function userBubble(text) {
  const el = document.createElement("div");
  el.className = "trip-turn";
  el.innerHTML = `<div class="trip-user-msg"><b>${esc(text)}</b></div>`;
  $("feed").appendChild(el);
  return el;
}

function newTurn() {
  const turn = document.createElement("div");
  turn.className = "trip-turn";
  turn.innerHTML = `<div class="trip-status-line" data-state="busy"></div><div class="trip-flow"></div>`;
  $("feed").appendChild(turn);
  turn.scrollIntoView({ block: "end" });
  return turn;
}

function status(turn, text, state) {
  const line = turn.querySelector(".trip-status-line");
  line.textContent = text;
  if (state) line.dataset.state = state;
}

function addBlock(turn, title, body) {
  const flow = turn.querySelector(".trip-flow");
  const el = document.createElement("div");
  el.className = "trip-block";
  el.innerHTML = `<div class="trip-block-title">${esc(title)}</div>` +
                 `<div class="trip-block-body"></div>`;
  el.querySelector(".trip-block-body").textContent = body;
  flow.appendChild(el);
  el.scrollIntoView({ block: "end", behavior: "smooth" });
  return el;
}

function addAsk(turn, question, options, recommendedId) {
  const flow = turn.querySelector(".trip-flow");
  const el = document.createElement("div");
  el.className = "route-ask";
  el.innerHTML = `<div class="route-ask-question">${esc(question)}</div>` +
    `<div class="route-ask-recommend">推荐：${esc(recommendedId)}</div>` +
    `<div class="route-options"></div>`;
  const box = el.querySelector(".route-options");
  box.innerHTML = options.map((o) =>
    `<button class="prompt-btn" type="button" style="margin:6px 6px 0 0; text-align:left">${esc(o)}</button>`
  ).join("");
  flow.appendChild(el);
  el.scrollIntoView({ block: "end", behavior: "smooth" });
  return el;
}

/* 转场按钮：挂在气泡下方 */
function addSuggest(turn, toMode, note, query) {
  const flow = turn.querySelector(".trip-flow");
  const el = document.createElement("div");
  el.className = "suggest-row";
  el.innerHTML = `<button class="suggest-btn" type="button">` +
    `去${esc(MODES[toMode].label)} ${toMode === "guide" ? "→" : "←"}</button>` +
    `<span class="suggest-note">${esc(note)}</span>`;
  el.querySelector("button").onclick = () => switchMode(toMode, query);
  flow.appendChild(el);
  el.scrollIntoView({ block: "end", behavior: "smooth" });
}

/* ---------- 模式切换 ---------- */
function switchMode(next, query) {
  if (!MODES[next]) return;
  mode = next;
  document.querySelectorAll(".trip-plugin").forEach((b) =>
    b.classList.toggle("active", b.dataset.mode === next));

  // 切模式 = 开新会话：清上下文、回开场态，但不清左栏记录
  if (query) {
    showChat();
    renderFixed();
    runTurn(query);
  } else {
    showHero();
  }
}

/* ---------- 演示一条完整对话（假数据 + 假流式） ---------- */
async function runTurn(text) {
  userBubble(text);
  const turn = newTurn();
  const m = MODES[mode];

  status(turn, "收到，正在理解你的需求…");

  // 演示：路线模式下遇到「玩 N 天」→ 引流到攻略
  if (mode === "route" && /玩|攻略|\d\s*天/.test(text)) {
    await sleep(700);
    stepSet(0, "busy");
    status(turn, "这句更像旅游需求，不是路线需求…");
    await sleep(900);
    addBlock(turn,
      "杭州大致分这几块",
      "· 西湖一圈：断桥、苏堤、白堤，步行加坐船，半天到一天\n" +
      "· 西边灵隐飞来峰：寺庙加爬山，台阶多，带老人要慢\n" +
      "· 市区河坊街一带：吃和逛，晚上最热闹\n" +
      "· 远一点还有西溪湿地、宋城，各占半天\n\n3 天时间，前三块基本能覆盖。\n" +
      "上面只说到「玩什么」，具体哪天去哪、怎么排，属于攻略的事。" );
    addSuggest(turn, "guide", "要不要我按 3 天排一个具体攻略？", text);
    status(turn, "可以先看攻略，之后再回来查每天怎么走", "done");
    return;
  }

  // 演示：攻略模式下遇到「A 到 B 怎么走」→ 引流到路线
  if (mode === "guide" && /到|怎么走/.test(text)) {
    await sleep(700);
    stepSet(0, "busy");
    status(turn, "这句更像路线需求，不是攻略需求…");
    await sleep(900);
    addBlock(turn,
      "这是一段点对点的移动",
      "「杭州东站 → 灵隐寺」要的是具体怎么走：打车多久、地铁要换乘几次、带老人哪个更省力。\n" +
      "这属于路线规划，不是「玩什么」的问题。" );
    addSuggest(turn, "route", "去路线规划里比一比？", text);
    status(turn, "切过去会带着这句话直接查", "done");
    return;
  }

  // 正常情况：按当前模式的四段跑一遍
  for (let i = 0; i < m.steps.length; i++) {
    stepSet(i, "busy");
    status(turn, ["正在确认需求…", "正在查候选…", "正在整理结论…", "正在写提醒…"][i] || "处理中…");
    await sleep(500);

    if (mode === "route") {
      if (i === 0) addBlock(turn, "需求确认", mockNeedText());
      if (i === 1) {
        addBlock(turn, "候选路线对比",
          "方案一｜打车/驾车\n用时：约 27 分钟\n距离：16.7 公里\n费用：约 43 元\n" +
          "步行：几乎不用走\n\n方案二｜公交/地铁\n用时：约 53 分钟\n距离：15.9 公里\n" +
          "费用：20 元\n步行：0.8 公里\n换乘：0 次（地铁 19 号线）");
        addAsk(turn, "你想按哪个方案走？", ["方案一｜打车/驾车", "方案二｜公交/地铁"], "方案一");
      }
      if (i === 2) {
        addBlock(turn, "推荐方案",
          "推荐：方案一（打车/驾车）\n" +
          "理由：\n" +
          "1. 带老人、偏好少走路，打车从站台直接到寺门口，省掉 0.8 公里步行和进出站。\n" +
          "2. 多花约 23 元，换来少走 25 分钟，每分钟约 0.9 元，这种情况值得。\n" +
          "3. 今天有雾，路上时间不确定性大，打车更可控。\n" +
          "备选：方案二｜公交/地铁\n什么时候换：不赶时间、想省钱，或者雾散了路况好。");
      }
      if (i === 3) {
        addBlock(turn, "出发提醒",
          "建议出发：现在（预留 10 分钟等车）\n" +
          "· 当前有雾，请提醒司机减速；让司机尽量开到灵隐寺 7 号门。\n" +
          "· 杭州东站打车高峰期要排队，预留的 10 分钟就是这个余量。\n" +
          "· 以上耗时按当前路况估算，出发前再看一次实时路况。");
      }
    } else {
      if (i === 0) addBlock(turn, "天气", "杭州未来 3 天\n11-14 阴 12~19°C\n11-15 小毛毛雨 13~18°C\n11-16 阴 11~17°C");
      if (i === 1) {
        addBlock(turn, "景点推荐",
          "1. 西湖游船（湖滨码头）—— 坐船看三潭印月，不用走长路\n" +
          "2. 浙江省博物馆（之江馆）—— 室内，雨天不受影响，有电梯和休息区\n" +
          "3. 河坊街·南宋御街 —— 晚间逛吃，平路好走\n\n景点清单：西湖游船、浙江省博物馆、河坊街");
        const el = document.createElement("div");
        el.className = "route-ask";
        el.innerHTML = `<div class="route-ask-question">这些景点可以吗？可以去掉不想去的，也可以补一个。</div>` +
          `<div class="route-options"></div>`;
        el.querySelector(".route-options").innerHTML =
          ["西湖游船", "浙江省博物馆", "河坊街"].map((s) =>
            `<button class="prompt-btn" type="button" style="margin:6px 6px 0 0">✓ ${s}</button>`).join("");
        turn.querySelector(".trip-flow").appendChild(el);
      }
      if (i === 2) {
        addBlock(turn, "行程安排",
          "Day 1｜西湖一圈\n上午：西湖游船（约 2 小时）\n下午：白堤慢走（约 1.5 小时）\n晚上：河坊街（约 2 小时）\n\n" +
          "Day 2｜室内为主\n上午：浙江省博物馆（约 3 小时）\n下午：自由休息\n\n" +
          "Day 3｜机动");
      }
      if (i === 3) {
        addBlock(turn, "游玩建议",
          "· 12、13 号都有雨，把室内的博物馆放在中间一天最稳。\n" +
          "· 西湖游船和博物馆都要预约，出发前确认一下当天放票时间。\n" +
          "· 带老人就多用打车接驳，少坐公交，减少走路。\n" +
          "· 每天别排超过两个点，中间留出休息时间。\n" +
          "· 从你那边怎么到杭州（高铁/航班）请用 12306 或航司 App 查，" +
          "到了杭州之后每天的市内移动，可以切到路线规划里逐段查。");
      }
    }
    stepSet(i, "done");
  }

  // 攻略跑完：导流回路线（第二期才做多点串联，这里只提示）
  if (mode === "guide") {
    status(turn, "攻略写好了。想查每天具体怎么走，去路线规划里逐段查。", "done");
    addSuggest(turn, "route", "现在查第一天的路？", "从杭州东站到西湖怎么走");
  } else {
    status(turn, "CTOS 规划结束 · 用时 6 秒", "done");
  }
}

function mockNeedText() {
  return "起点：杭州东站\n终点：灵隐寺\n出发时间：现在\n偏好：少走路\n同行：带老人\n" +
         "天气：杭州 未来 1 天 · 阴 12~19°C";
}

/* ---------- 发送 ---------- */
function send() {
  const input = $("hero").style.display === "none" ? $("chat-input") : $("hero-input");
  const text = (input.value || "").trim();
  if (!text) return;
  input.value = "";
  if ($("hero").style.display !== "none") { showChat(); renderFixed(); }
  runTurn(text);
}

/* ---------- 原型工具条 ---------- */
function resetTo(m) {
  mode = m;
  document.querySelectorAll(".trip-plugin").forEach((b) =>
    b.classList.toggle("active", b.dataset.mode === m));
  showHero();
}

function demoRoute() {
  showChat(); renderFixed(); runTurn("从杭州东站到灵隐寺，带老人，少走路");
}

function demoGuide() { resetTo("guide"); }

function demoGuideChat() {
  // 先切到攻略模式，再进对话态，否则进度条还是路线那套
  resetTo("guide");
  showChat(); renderFixed(); runTurn("下周去杭州玩 3 天，带老人");
}

function toggleTheme() {
  themeIdx = (themeIdx + 1) % THEMES.length;
  const t = THEMES[themeIdx];
  if (t) document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
}

/* ---------- 启动 ---------- */
document.querySelectorAll(".trip-plugin").forEach((b) => {
  b.onclick = () => {
    // 切换模式：回开场态，上下文清空，记录不动
    mode = b.dataset.mode;
    document.querySelectorAll(".trip-plugin").forEach((o) =>
      o.classList.toggle("active", o === b));
    showHero();
  };
});

$("hero-quick").addEventListener("click", (e) => {
  const btn = e.target.closest(".trip-quick-btn");
  if (!btn) return;
  showChat(); renderFixed(); runTurn(btn.dataset.q);
});

$("hero-input").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
$("chat-input").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });

renderHistory();
showHero();
</script>
</body>
</html>
